plugins {
    id 'java'
    id 'application'
}

group = 'org.jdesktop.lg3d'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://jcenter.bintray.com' }
}

ext {
    joglVersion = '2.4.0-rc'
}

dependencies {
    // JOGL - OpenGL for Java
    implementation "org.jogamp:jogl-all:${joglVersion}"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-linux-amd64"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-linux-i586"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-win32-amd64"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-win32-x86"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-macosx-universal"

    implementation "org.jogamp:gluegen-rt:${joglVersion}"
    implementation "org.jogamp:gluegen-rt:${joglVersion}:natives-linux-amd64"
    implementation "org.jogamp:gluegen-rt:${joglVersion}:natives-win32-amd64"
    implementation "org.jogamp:gluegen-rt:${joglVersion}:natives-macosx-universal"

    // Testing
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

application {
    mainClass = 'org.jdesktop.lg3d.displayserver.Main'
}

test {
    useJUnit()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

// Create run tasks for demos
task runDemo(type: JavaExec) {
    group = 'application'
    description = 'Run the basic demo'
    mainClass = 'org.jdesktop.lg3d.displayserver.DemoLauncher'
    classpath = sourceSets.main.runtimeClasspath
}

task runEnhancedDemo(type: JavaExec) {
    group = 'application'
    description = 'Run the enhanced demo'
    mainClass = 'org.jdesktop.lg3d.displayserver.EnhancedDemo'
    classPath = sourceSets.main.runtimeClasspath
}

task runFileBrowserDemo(type: JavaExec) {
    group = 'application'
    description = 'Run the file browser demo'
    mainClass = 'org.jdesktop.lg3d.displayserver.FileBrowserDemo'
    classPath = sourceSets.main.runtimeClasspath
}

task info {
    doLast {
        println '========================================'
        println '  LG3D Modern - Build Configuration'
        println '========================================'
        println "Project:       ${project.name}"
        println "Version:      ${version}"
        println "Java:         ${java.version}"
        println "JOGL:         ${joglVersion}"
        println "Gradle:       ${gradle.gradleVersion}"
        println '========================================'
        println 'Run: gradle run         (main app)'
        println 'Run: gradle runDemo    (basic demo)'
        println 'Run: gradle runEnhancedDemo'
        println 'Run: gradle runFileBrowserDemo'
        println '========================================'
    }
}