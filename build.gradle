plugins {
    id 'java'
    id 'application'
}

group = 'org.jdesktop.lg3d'
version = '1.0.0-modern'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    joglVersion = '2.4.0-rc'
    gluegenVersion = '2.4.0-rc'
}

dependencies {
    // JOGL - Modern replacement for Java 3D
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-linux-arm64"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-linux-amd64"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-win32"
    implementation "org.jogamp:jogl-all:${joglVersion}:natives-macosx-universal"
    implementation "org.jogamp:gluegen-rt:${gluegenVersion}"
    implementation "org.jogamp:gluegen-rt:${gluegenVersion}:natives-linux-arm64"
    implementation "org.jogamp:gluegen-rt:${gluegenVersion}:natives-linux-amd64"
    implementation "org.jogamp:gluegen-rt:${gluegenVersion}:natives-win32"
    implementation "org.jogamp:gluegen-rt:${gluegenVersion}:natives-macosx-universal"

    // For AWT integration
    implementation "org.jogamp:jogl-all:${joglVersion}"

    // Testing
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xlint:unchecked'
}

application {
    mainClass = 'org.jdesktop.lg3d.displayserver.Main'
}

test {
    useJUnit()
}

// Make sure all Java files are compiled
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

// Task to show project info
task info {
    doLast {
        println "========================================"
        println "  LG3D Modern - Build Configuration"
        println "========================================"
        println "Java Version: ${java.version}"
        println "Java Source:  ${java.sourceCompatibility}"
        println "Build Tool:   Gradle ${gradle.gradleVersion}"
        println "JOGL Version: ${joglVersion}"
        println "========================================"
    }
}